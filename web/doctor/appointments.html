<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appointments — HMSS</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div class="layout">

  <header class="top-bar">
    <span class="logo">🏥 HMSS</span>
    <span class="spacer"></span>
    <span class="user-info" id="user-name"></span>
    <button class="btn-logout" id="btn-logout" onclick="logout()">Sign Out</button>
  </header>

  <nav class="sidebar">
    <span class="nav-section-title">Doctor Menu</span>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="appointments.html">📅 Appointments</a>
    <a href="patient_records.html">👤 Patient Records</a>
    <a href="upload_results.html">📄 Upload Results</a>
    <a href="flagged_results.html">⚠️ Flagged Results</a>
  </nav>

  <main class="content">
    <div class="page-header">
      <h1>Appointments</h1>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Patient</th><th>Start</th><th>End</th><th>Reason</th><th>Location</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="appt-tbody">
          <tr><td colspan="7" class="text-muted" style="padding:24px;text-align:center;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

</div>

<!-- Reschedule modal -->
<div class="modal-overlay" id="modal-reschedule">
  <div class="modal">
    <div class="modal-header">
      <h2>Reschedule Appointment</h2>
      <button class="modal-close" onclick="closeReschedule()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>New Start</label>
        <input type="datetime-local" id="reschedule-start" />
      </div>
      <div class="form-group">
        <label>New End</label>
        <input type="datetime-local" id="reschedule-end" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeReschedule()">Cancel</button>
      <button class="btn btn-primary" onclick="submitReschedule()">Save</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/api.js"></script>
<script src="/js/doctor.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  var user = getCurrentUser();
  if (!user || user.role !== "doctor") {
    clearSession();
    window.location.href = "/index.html";
    return;
  }
  document.getElementById("user-name").textContent = "Dr. " + user.first_name + " " + user.last_name;
  loadAppointments();
});
</script>
</body>
</html>
