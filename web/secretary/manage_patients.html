<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Patients — HMSS</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div class="layout">
  <header class="top-bar">
    <span class="logo">🏥 HMSS</span>
    <span class="spacer"></span>
    <span class="user-info" id="user-name"></span>
    <button class="btn-logout" id="btn-logout" onclick="logout()">Sign Out</button>
  </header>
  
  <nav class="sidebar">
    <span class="nav-section-title">Secretary Menu</span>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="manage_patients.html">👥 Manage Patients</a>
    <a href="manage_doctors.html">👨‍⚕️ Manage Doctors</a>
    <a href="appointments.html">📅 Appointments</a>
    <a href="notifications.html">🔔 Notifications</a>
  </nav>
  
  <main class="content">
    <div class="page-header">
      <h1>Manage Patients</h1>
      <button class="btn btn-primary" onclick="openCreatePatient()">+ Add Patient</button>
    </div>
    <div class="search-bar">
      <input type="text" id="search-patients" placeholder="Search by name, email, or code…" oninput="filterPatients()" />
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Code</th><th>Name</th><th>Email</th><th>DOB</th><th>Gender</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="patients-tbody">
          <tr><td colspan="7" class="text-muted" style="padding:24px;text-align:center;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- Create patient modal -->
<div class="modal-overlay" id="modal-create-patient">
  <div class="modal">
    <div class="modal-header">
      <h2>Add New Patient</h2>
      <button class="modal-close" onclick="closeCreatePatient()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label>First Name *</label><input type="text" id="p-first-name" /></div>
        <div class="form-group"><label>Last Name *</label><input type="text" id="p-last-name" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Email *</label><input type="email" id="p-email" /></div>
        <div class="form-group"><label>Password *</label><input type="password" id="p-password" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Phone</label><input type="text" id="p-phone" /></div>
        <div class="form-group"><label>Date of Birth</label><input type="date" id="p-dob" /></div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Gender</label>
          <select id="p-gender"><option value="">—</option><option>male</option><option>female</option><option>other</option></select>
        </div>
        <div class="form-group">
          <label>Blood Type</label>
          <select id="p-blood"><option value="">—</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select>
        </div>
      </div>
      <div class="form-group"><label>Patient Code</label><input type="text" id="p-code" placeholder="Auto-generated if blank" /></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeCreatePatient()">Cancel</button>
      <button class="btn btn-primary" onclick="submitCreatePatient()">Create</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/api.js"></script>
<script src="/js/secretary.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  var user = getCurrentUser();
  if (!user || user.role !== "secretary") {
    clearSession();
    window.location.href = "/index.html";
    return;
  }
  document.getElementById("user-name").textContent = user.first_name + " " + user.last_name;
  loadPatients();
});

function filterPatients() {
  var q = document.getElementById("search-patients").value.toLowerCase();
  document.querySelectorAll("#patients-tbody tr").forEach(function(tr) {
    tr.style.display = tr.textContent.toLowerCase().includes(q) ? "" : "none";
  });
}
</script>
</body>
</html>
