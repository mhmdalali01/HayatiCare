<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Manage Doctors — HMSS</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div class="layout">
  <header class="top-bar">
    <span class="logo">🏥 HMSS</span>
    <span class="spacer"></span>
    <span class="user-info" id="user-name"></span>
    <button class="btn-logout" id="btn-logout" onclick="logout()">Sign Out</button>
  </header>
  
  <nav class="sidebar">
    <span class="nav-section-title">Secretary Menu</span>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="manage_patients.html">👥 Manage Patients</a>
    <a href="manage_doctors.html">👨‍⚕️ Manage Doctors</a>
    <a href="appointments.html">📅 Appointments</a>
    <a href="notifications.html">🔔 Notifications</a>
  </nav>
  
  <main class="content">
    <div class="page-header">
      <h1>Manage Doctors</h1>
      <button class="btn btn-primary" onclick="openCreateDoctor()">+ Add Doctor</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Specialization</th><th>License</th><th>Office</th><th>Actions</th></tr></thead>
        <tbody id="doctors-tbody">
          <tr><td colspan="6" class="text-muted" style="padding:24px;text-align:center;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- Create doctor modal -->
<div class="modal-overlay" id="modal-create-doctor">
  <div class="modal">
    <div class="modal-header">
      <h2>Add New Doctor</h2>
      <button class="modal-close" onclick="closeCreateDoctor()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label>First Name *</label><input type="text" id="d-first-name" /></div>
        <div class="form-group"><label>Last Name *</label><input type="text" id="d-last-name" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Email *</label><input type="email" id="d-email" /></div>
        <div class="form-group"><label>Password *</label><input type="password" id="d-password" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Phone</label><input type="text" id="d-phone" /></div>
        <div class="form-group"><label>Specialization</label><input type="text" id="d-specialization" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>License Number</label><input type="text" id="d-license" /></div>
        <div class="form-group"><label>Office Room</label><input type="text" id="d-room" /></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeCreateDoctor()">Cancel</button>
      <button class="btn btn-primary" onclick="submitCreateDoctor()">Create</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/api.js"></script>
<script src="/js/secretary.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  var user = getCurrentUser();
  if (!user || user.role !== "secretary") {
    clearSession();
    window.location.href = "/index.html";
    return;
  }
  document.getElementById("user-name").textContent = user.first_name + " " + user.last_name;
  loadDoctors();
});
</script>
</body>
</html>
