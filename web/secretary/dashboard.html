<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secretary Dashboard — HMSS</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div class="layout">
  <header class="top-bar">
    <span class="logo">🏥 HMSS</span>
    <span class="spacer"></span>
    <span class="user-info" id="user-name"></span>
    <button class="btn-logout" id="btn-logout" onclick="logout()">Sign Out</button>
  </header>
  
  <nav class="sidebar">
    <span class="nav-section-title">Secretary Menu</span>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="manage_patients.html">👥 Manage Patients</a>
    <a href="manage_doctors.html">👨‍⚕️ Manage Doctors</a>
    <a href="appointments.html">📅 Appointments</a>
    <a href="notifications.html">🔔 Notifications</a>
  </nav>
  
  <main class="content">
    <div class="page-header">
      <h1>Dashboard</h1>
    </div>
    <div class="cards-row">
      <div class="card">
        <div class="card-stat" id="stat-patients">—</div>
        <div class="card-label">Total Patients</div>
      </div>
      <div class="card">
        <div class="card-stat" id="stat-doctors">—</div>
        <div class="card-label">Total Doctors</div>
      </div>
      <div class="card">
        <div class="card-stat" id="stat-appts">—</div>
        <div class="card-label">Today's Appointments</div>
      </div>
    </div>
  </main>
</div>

<div id="toast-container"></div>
<script src="/js/api.js"></script>
<script src="/js/secretary.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  var user = getCurrentUser();
  if (!user || user.role !== "secretary") {
    clearSession();
    window.location.href = "/index.html";
    return;
  }
  document.getElementById("user-name").textContent = user.first_name + " " + user.last_name;
  
  // Load dashboard stats
  loadDashboard();
});

function loadDashboard() {
  api.get("/api/patients").then(function(data) {
    if (data.success) {
      document.getElementById("stat-patients").textContent = data.data.length;
    }
  });
  
  api.get("/api/doctors").then(function(data) {
    if (data.success) {
      document.getElementById("stat-doctors").textContent = data.data.length;
    }
  });
  
  api.get("/api/appointments").then(function(data) {
    if (data.success) {
      var today = new Date().toDateString();
      var count = (data.data || []).filter(function(a) {
        return new Date(a.scheduled_start).toDateString() === today;
      }).length;
      document.getElementById("stat-appts").textContent = count;
    }
  });
}
</script>
</body>
</html>
